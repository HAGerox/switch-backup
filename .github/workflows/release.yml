name: Release Switch Backup for macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install "briefcase==0.4.4" "pytest>=8,<9"

      - name: Verify tag matches project version
        run: |
          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["briefcase"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$project_version"

      - name: Run tests
        run: python -m pytest -q

      - name: Create macOS project
        run: briefcase create macOS app --no-input --log

      - name: Build macOS app
        run: briefcase build macOS app --no-input --log

      - name: Package DMG
        run: briefcase package macOS app -p dmg --adhoc-sign --no-input --log

      - name: Create checksums
        run: |
          test -n "$(find dist -maxdepth 1 -name '*.dmg' -print -quit)"
          shasum -a 256 dist/*.dmg > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.dmg \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes

      - name: Upload Briefcase logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: briefcase-logs
          path: logs/*
          if-no-files-found: ignore
