name: Release Switch Backup for macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.9"
          cache: pip

      - name: Bootstrap verified pip
        run: python -m pip install --no-deps "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

      - name: Install build dependencies
        run: python -m pip install "briefcase==0.4.4" "gitpython>=3.2.1" "urllib3>=2.8.0" "pytest>=9.0.3,<10" "certifi>=2026.10.19"

      - name: Verify tag matches project version
        run: |
          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["briefcase"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$project_version"

      - name: Run tests
        run: python -m pytest -q

      - name: Prepare verified PSF Python framework
        run: python scripts/prepare-python-support.py

      - name: Create macOS project
        run: briefcase create macOS app --no-input --log

      - name: Build macOS app
        run: briefcase build macOS app --no-input --log

      - name: Verify bundled CA stores
        run: |
          app_path=$(find build/switchbackup/macos/app -maxdepth 1 -name '*.app' -print -quit)
          python scripts/check-python-security.py "$app_path"

      - name: Ad-hoc sign the app bundle
        run: briefcase package macOS app -p dmg --adhoc-sign --no-input --log

      - name: Create unsigned DMG
        run: |
          app_path=$(find build/switchbackup/macos/app -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          release_dmg="dist/Switch-Backup-${GITHUB_REF_NAME#v}.dmg"
          ./scripts/package-macos-dmg.sh "$app_path" "$release_dmg"
          hdiutil verify "$release_dmg"
          codesign --verify --deep --strict "$app_path"
          if codesign --verify "$release_dmg" >/dev/null 2>&1; then
            echo "The DMG is unexpectedly signed."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          asset="dist/Switch-Backup-${GITHUB_REF_NAME#v}.dmg"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if ! gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$asset")"; then
              gh release upload "$GITHUB_REF_NAME" "$asset"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag --generate-notes
          fi

      - name: Upload Briefcase logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: briefcase-logs
          path: logs/*
          if-no-files-found: ignore
