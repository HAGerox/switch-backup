name: Release Switch Backup for macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish macOS DMG
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install "briefcase==0.4.4" "pytest>=8,<9"

      - name: Verify tag matches project version
        run: |
          project_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["briefcase"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$project_version"

      - name: Run tests
        run: python -m pytest -q

      - name: Create macOS project
        run: briefcase create macOS app --no-input --log

      - name: Build macOS app
        run: briefcase build macOS app --no-input --log

      - name: Ad-hoc sign the app bundle
        run: briefcase package macOS app -p dmg --adhoc-sign --no-input --log

      - name: Create unsigned DMG
        run: |
          app_path=$(find build/switchbackup/macos/app -maxdepth 1 -name '*.app' -print -quit)
          test -n "$app_path"
          release_dmg="dist/Switch-Backup-${GITHUB_REF_NAME#v}.dmg"
          ./scripts/package-macos-dmg.sh "$app_path" "$release_dmg"
          hdiutil verify "$release_dmg"
          codesign --verify --deep --strict "$app_path"
          if codesign --verify "$release_dmg" >/dev/null 2>&1; then
            echo "The DMG is unexpectedly signed."
            exit 1
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/Switch-Backup-${GITHUB_REF_NAME#v}.dmg" \
            --verify-tag \
            --generate-notes

      - name: Upload Briefcase logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: briefcase-logs
          path: logs/*
          if-no-files-found: ignore
