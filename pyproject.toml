[tool.briefcase]
project_name = "Switch Backup"
bundle = "com.switchbackup"
version = "0.1.4"
url = "https://github.com/HAGerox/switch-backup"
license = "MIT"
license-files = ["LICENSE"]
author = "Finn Stanley"
author_email = "73347504+HAGerox@users.noreply.github.com"

[tool.briefcase.app.switchbackup]
formal_name = "Switch Backup"
description = "Minimal Cisco switch configuration backup utility"
long_description = """A small macOS utility for backing up Cisco switch startup configurations to a ZIP file."""
icon = "resources/icon"
sources = ["src/switchbackup"]
test_sources = ["tests"]
requires = [
    "netmiko==4.7.0",
    "keyring>=25,<27",
    "cryptography==48.0.1",
]
test_requires = ["pytest>=8,<9"]

[tool.briefcase.app.switchbackup.macOS]
universal_build = true
requires = [
    "toga-cocoa~=0.5.6",
    "std-nslog~=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
