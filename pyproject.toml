[tool.briefcase]
project_name = "Switch Backup"
bundle = "com.switchbackup"
version = "0.1.9"
url = "https://github.com/HAGerox/switch-backup"
license = "MIT"
license-files = ["LICENSE"]
author = "Finn Stanley"
author_email = "73347504+HAGerox@users.noreply.github.com"

[tool.briefcase.app.switchbackup]
formal_name = "Switch Backup"
description = "Minimal Cisco switch configuration backup utility"
long_description = """A small macOS utility for backing up Cisco switch startup configurations to a ZIP file."""
icon = "resources/icon"
sources = ["src/switchbackup"]
test_sources = ["tests"]
requires = [
    "netmiko==4.8.0",
    "keyring>=25,<27",
    "cryptography==50.0.2",
    "paramiko>=5.1.0,<6",
    "certifi>=2026.10.19",
]
test_requires = ["pytest>=9.0.3,<10"]

[tool.briefcase.app.switchbackup.macOS]
universal_build = false
support_package = ".build-support/Python-3.14.9-macOS-support.tar.gz"
cleanup_paths = ["**/lib/python3.14/ensurepip", "**/lib/python3.14/test"]
info."NSLocalNetworkUsageDescription" = "Switch Backup needs access to your local network to discover and connect to switches over SSH."
requires = [
    "toga-cocoa~=0.5.6",
    "std-nslog~=2.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
